name: CI

on:
  create:
    tags:
      - "*" # run on all tags
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      - name: Install Django
        run: |
          uv run pip install django~=${{ matrix.django-version }}
      - name: Cache prek hooks
        if: matrix.python-version == '3.13' && matrix.django-version == '6.1'
        id: prek-cache
        uses: actions/cache@v5
        with:
          path: $HOME/.cache/prek
          key: ${{ runner.os }}-${{ matrix.python-version }}-prek-hooks-${{ hashFiles('prek.toml') }}
      - name: Run prek
        if: matrix.python-version == '3.13' && matrix.django-version == '6.1'
        run: |
          uv run prek run --all-files
        env:
          PREK_HOME: $HOME/.cache/prek
      - name: Run tests and coverage
        run: |
          uv run coverage run --source=highlightjs manage.py test
          # output coverage report
          uv run coverage report
          # output coverage report in xml format
          uv run coverage xml
      - name: Publish coverage
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        uses: orgoro/coverage@v3.3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish package
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1' && startsWith(github.ref, 'refs/tags')
        run: |
          echo "Publishing package to PyPI"
          echo "uv version: $(uv --version)"
          uv build
          uv publish --username=__token__ --password=${{ secrets.PYPI_SECRET }}
      - name: Minimize uv cache
        run: uv cache prune --ci
